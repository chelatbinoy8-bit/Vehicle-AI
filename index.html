<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoSage Vehicle AI</title>
    <style>
        /* ==========================================================================
           CSS STYLES
           ========================================================================== */

        :root {
            --bg-dark: #020617;
            --bg-grad: #0f172a;
            --glass-bg: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(56, 189, 248, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-glow: #0ea5e9;
            --accent-glow-secondary: #8b5cf6;
            --highlight: #c084fc;
            --error: #ef4444;
            --success: #10b981;
            --font-main: 'Inter', system-ui, -apple-system, sans-serif;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Splash Screen Animation */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease-out, visibility 1s;
        }

        .splash-content {
            text-align: center;
            animation: zoomIn 1.5s ease-out;
        }

        .splash-tagline {
            margin-top: 20px;
            font-size: 1.1rem;
            color: var(--text-muted);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 2s ease-out 1s forwards;
        }

        /* Security Warning Banner */
        .security-banner {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            text-align: center;
            padding: 8px 16px;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(239, 68, 68, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            z-index: 100;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
        }

        .view {
            display: none;
            flex: 1;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            overflow: hidden;
            background: radial-gradient(circle at 50% 0%, var(--bg-grad), var(--bg-dark) 80%);
        }

        .view.active {
            display: flex;
            opacity: 1;
        }

        /* ==========================================================================
           AUTH SCREEN
           ========================================================================== */
        #auth-view {
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .logo-svg {
            width: 100px;
            height: 100px;
            fill: none;
            stroke: var(--accent-glow);
            stroke-width: 2;
            filter: drop-shadow(0 0 15px rgba(14, 165, 233, 0.6));
            animation: pulse 3s infinite alternate;
        }

        .logo-svg .gear {
            transform-origin: 50% 50%;
            animation: spin 12s linear infinite;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(to right, var(--accent-glow), var(--accent-glow-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 32px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-main);
            outline: none;
            transition: var(--transition);
        }

        .input-field:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.3);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-glow), var(--accent-glow-secondary));
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        /* ==========================================================================
           CHAT INTERFACE
           ========================================================================== */
        .top-bar {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .message {
            display: flex;
            gap: 16px;
            max-width: 85%;
            animation: slideIn 0.4s ease-out;
        }

        .message.user { align-self: flex-end; flex-direction: row-reverse; }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
        }

        .msg-content {
            background: rgba(15, 23, 42, 0.6);
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            line-height: 1.6;
        }

        .message.user .msg-content { background: rgba(14, 165, 233, 0.1); border-color: rgba(14, 165, 233, 0.2); }

        .term-highlight { color: var(--highlight); font-weight: 600; text-shadow: 0 0 8px rgba(192, 132, 252, 0.4); }

        .metadata { font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; display: flex; gap: 12px; justify-content: flex-end; }

        .input-area {
            padding: 24px;
            background: var(--glass-bg);
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 16px;
        }

        textarea {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            color: var(--text-main);
            resize: none;
            height: 56px;
            outline: none;
        }

        /* Animations */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { from { opacity: 0.8; transform: scale(0.98); } to { opacity: 1; transform: scale(1.02); } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-content">
            <svg class="logo-svg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" stroke-dasharray="8 4" opacity="0.3"/>
                <path class="gear" d="M50 20 L55 25 L65 22 L68 32 L78 35 L75 45 L80 50 L75 55 L78 65 L68 68 L65 78 L55 75 L50 80 L45 75 L35 78 L32 68 L22 65 L25 55 L20 50 L25 45 L22 35 L32 32 L35 22 L45 25 Z" fill="none"/>
                <path d="M45 50 L50 45 L55 50 L50 55 Z" fill="var(--accent-glow)"/>
            </svg>
            <h1>AutoSage</h1>
            <div class="splash-tagline">Precision Automotive Intelligence</div>
        </div>
    </div>

    <div class="security-banner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path></svg>
        Warning: Use API keys for personal sessions only.
    </div>

    <!-- Auth View -->
    <div id="auth-view" class="view">
        <div class="auth-card glass">
            <h1>Ignition</h1>
            <p class="subtitle">Enter your Groq API Key to start the engine</p>
            <input type="password" id="api-key" class="input-field" placeholder="gsk_..." style="margin-bottom: 20px;">
            <button id="verify-btn" class="btn">
                <span id="verify-text">Start System</span>
                <div id="verify-loader" class="loader"></div>
            </button>
            <div id="auth-error" class="error-msg" style="color: var(--error); margin-top: 15px; font-size: 0.9rem;"></div>
        </div>
    </div>

    <!-- Chat View -->
    <div id="chat-view" class="view">
        <div class="top-bar">
            <div style="font-weight: 700; color: var(--accent-glow);">AUTOSAGE AI</div>
            <div id="active-model-badge" style="font-size: 0.75rem; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 20px;">Detecting Model...</div>
        </div>
        <div id="chat-container" class="chat-container"></div>
        <div class="input-area">
            <textarea id="chat-input" placeholder="Ask your vehicle expert..."></textarea>
            <button id="send-btn" class="btn" style="width: auto; padding: 0 24px;">Send</button>
        </div>
    </div>

    <script>
        // Constants & Config
        const GROQ_API_URL = 'https://api.groq.com/openai/v1/chat/completions';
        const GROQ_MODELS_URL = 'https://api.groq.com/openai/v1/models';
        
        // Priority list of models (Llama 3.1 and 3.3 are currently supported)
        const SUPPORTED_MODELS = [
            'llama-3.3-70b-specdec',
            'llama-3.1-70b-versatile',
            'llama-3.1-8b-instant'
        ];

        let sessionApiKey = null;
        let activeModel = SUPPORTED_MODELS[0];
        let chatHistory = [];

        const VEHICLE_TERMS = ['torque', 'wheelbase', 'camshaft', 'transmission', 'ecu', 'abs', 'differential', 'turbocharger', 'rpm', 'suspension', 'chassis', 'crankshaft', 'piston', 'clutch'];

        // Initial Splash Sequence
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.visibility = 'hidden';
                    document.getElementById('auth-view').classList.add('active');
                }, 1000);
            }, 4000); // 4 seconds of animation + 1 second fade
        });

        // UI References
        const ui = {
            apiKey: document.getElementById('api-key'),
            verifyBtn: document.getElementById('verify-btn'),
            authError: document.getElementById('auth-error'),
            chatContainer: document.getElementById('chat-container'),
            chatInput: document.getElementById('chat-input'),
            sendBtn: document.getElementById('send-btn'),
            modelBadge: document.getElementById('active-model-badge')
        };

        // Auth Logic
        ui.verifyBtn.addEventListener('click', async () => {
            const key = ui.apiKey.value.trim();
            if (!key) return;

            ui.verifyBtn.disabled = true;
            document.getElementById('verify-loader').style.display = 'block';
            document.getElementById('verify-text').style.display = 'none';

            try {
                const response = await fetch(GROQ_MODELS_URL, {
                    headers: { 'Authorization': `Bearer ${key}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    const availableModels = data.data.map(m => m.id);
                    
                    // Auto-detect the best supported model
                    activeModel = SUPPORTED_MODELS.find(m => availableModels.includes(m)) || availableModels[0];
                    ui.modelBadge.textContent = `Engine: ${activeModel}`;
                    
                    sessionApiKey = key;
                    document.getElementById('auth-view').classList.remove('active');
                    document.getElementById('chat-view').classList.add('active');
                    
                    addMessage('ai', "System online. Diagnostic buffers cleared. I am AutoSage. How can I assist with your vehicle architecture today?");
                } else {
                    throw new Error("Access Denied. Check your key.");
                }
            } catch (err) {
                ui.authError.textContent = err.message;
            } finally {
                ui.verifyBtn.disabled = false;
                document.getElementById('verify-loader').style.display = 'none';
                document.getElementById('verify-text').style.display = 'block';
            }
        });

        // Chat Logic
        async function handleSend() {
            const text = ui.chatInput.value.trim();
            if (!text || !sessionApiKey) return;

            addMessage('user', text);
            ui.chatInput.value = '';
            
            const typingId = addTypingIndicator();
            
            try {
                const response = await fetch(GROQ_API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${sessionApiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: activeModel,
                        messages: [
                            { role: "system", content: "You are AutoSage, a vehicle expert. Use vehicle analogies for everything. Use at least one technical term like torque, ECU, or chassis in every response." },
                            ...chatHistory,
                            { role: "user", content: text }
                        ]
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                
                const aiText = data.choices[0].message.content;
                document.getElementById(typingId).remove();
                addMessage('ai', aiText);
                chatHistory.push({ role: "user", content: text }, { role: "assistant", content: aiText });

            } catch (err) {
                document.getElementById(typingId).remove();
                addMessage('ai', `Diagnostic Error: ${err.message}. Please check your connection.`);
            }
        }

        ui.sendBtn.addEventListener('click', handleSend);
        ui.chatInput.addEventListener('keypress', (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            
            let processedText = text;
            VEHICLE_TERMS.forEach(term => {
                const reg = new RegExp(`\\b${term}\\b`, 'gi');
                processedText = processedText.replace(reg, `<span class="term-highlight">$&</span>`);
            });

            div.innerHTML = `
                <div class="avatar">${role === 'ai' ? '⚙️' : '👤'}</div>
                <div class="msg-content">${processedText.replace(/\n/g, '<br>')}</div>
            `;
            ui.chatContainer.appendChild(div);
            ui.chatContainer.scrollTop = ui.chatContainer.scrollHeight;
        }

        function addTypingIndicator() {
            const id = 'typing-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'message ai';
            div.innerHTML = `<div class="avatar">⚙️</div><div class="msg-content">Processing...</div>`;
            ui.chatContainer.appendChild(div);
            ui.chatContainer.scrollTop = ui.chatContainer.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
