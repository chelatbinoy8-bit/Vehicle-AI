<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoSage Vehicle AI</title>
    <style>
        /* ==========================================================================
           CSS STYLES
           ========================================================================== */

        :root {
            --bg-dark: #020617;
            --bg-grad: #0f172a;
            --glass-bg: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(56, 189, 248, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-glow: #0ea5e9;
            --accent-glow-secondary: #8b5cf6;
            --highlight: #c084fc;
            --error: #ef4444;
            --success: #10b981;
            --font-main: 'Inter', system-ui, -apple-system, sans-serif;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Splash Screen Animation */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease-out, visibility 1s;
        }

        .splash-content {
            text-align: center;
            animation: zoomIn 1.5s ease-out;
        }

        .splash-tagline {
            margin-top: 20px;
            font-size: 1.1rem;
            color: var(--text-muted);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 2s ease-out 1s forwards;
        }

        /* Security Warning Banner */
        .security-banner {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            text-align: center;
            padding: 8px 16px;
            font-size: 0.8rem;
            border-bottom: 1px solid rgba(239, 68, 68, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            z-index: 100;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
        }

        .view {
            display: none;
            flex: 1;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            overflow: hidden;
            background: radial-gradient(circle at 50% 0%, var(--bg-grad), var(--bg-dark) 80%);
        }

        .view.active {
            display: flex;
            flex-direction: column;
            opacity: 1;
        }

        /* ==========================================================================
           AUTH SCREEN
           ========================================================================== */
        #auth-view {
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .logo-svg {
            width: 80px;
            height: 80px;
            fill: none;
            stroke: var(--accent-glow);
            stroke-width: 2;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(14, 165, 233, 0.4));
        }

        .logo-svg .gear {
            transform-origin: 50% 50%;
            animation: spin 12s linear infinite;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(to right, var(--accent-glow), var(--accent-glow-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-main);
            outline: none;
            margin-bottom: 16px;
            transition: var(--transition);
        }

        .input-field:focus {
            border-color: var(--accent-glow);
            background: rgba(0, 0, 0, 0.5);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-glow), var(--accent-glow-secondary));
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.3);
        }

        .btn:active { transform: translateY(0); }

        .loader {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        /* ==========================================================================
           CHAT INTERFACE
           ========================================================================== */
        .top-bar {
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.4);
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        /* Scrollbar styling */
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: slideIn 0.3s ease-out forwards;
        }

        .message.user { align-self: flex-end; flex-direction: row-reverse; }

        .avatar {
            width: 36px;
            height: 36px;
            min-width: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--glass-border);
            font-size: 1.1rem;
        }

        .msg-content {
            background: rgba(30, 41, 59, 0.5);
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .message.user .msg-content { 
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), rgba(139, 92, 246, 0.1)); 
            border-color: rgba(14, 165, 233, 0.3);
            border-bottom-right-radius: 4px;
        }
        
        .message.ai .msg-content {
            border-bottom-left-radius: 4px;
        }

        .term-highlight { 
            color: var(--highlight); 
            font-weight: 600; 
            border-bottom: 1px dashed rgba(192, 132, 252, 0.5);
        }

        .input-area-wrapper {
            padding: 20px 24px 30px;
            background: linear-gradient(to top, var(--bg-dark), transparent);
        }

        .input-area {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 12px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--glass-border);
            padding: 8px 12px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 4px;
            color: var(--text-main);
            resize: none;
            height: 44px;
            max-height: 150px;
            outline: none;
            font-family: inherit;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .send-btn-circle {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 50%;
            background: var(--accent-glow);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            color: white;
            margin-bottom: 2px;
        }

        .send-btn-circle:hover {
            transform: scale(1.05);
            background: var(--accent-glow-secondary);
        }

        .send-btn-circle svg {
            width: 18px;
            height: 18px;
            transform: translateX(1px);
        }

        /* Animations */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-content">
            <svg class="logo-svg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" stroke-dasharray="8 4" opacity="0.3"/>
                <path class="gear" d="M50 20 L55 25 L65 22 L68 32 L78 35 L75 45 L80 50 L75 55 L78 65 L68 68 L65 78 L55 75 L50 80 L45 75 L35 78 L32 68 L22 65 L25 55 L20 50 L25 45 L22 35 L32 32 L35 22 L45 25 Z" fill="none"/>
                <path d="M45 50 L50 45 L55 50 L50 55 Z" fill="var(--accent-glow)"/>
            </svg>
            <h1>AutoSage</h1>
            <div class="splash-tagline">Precision Automotive Intelligence</div>
        </div>
    </div>

    <div class="security-banner">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path></svg>
        Personal API Session Only
    </div>

    <!-- Auth View -->
    <div id="auth-view" class="view">
        <div class="auth-card glass">
            <svg class="logo-svg" viewBox="0 0 100 100" style="width: 60px; height: 60px;">
                <circle cx="50" cy="50" r="45" stroke-dasharray="8 4" opacity="0.3"/>
                <path class="gear" d="M50 20 L55 25 L65 22 L68 32 L78 35 L75 45 L80 50 L75 55 L78 65 L68 68 L65 78 L55 75 L50 80 L45 75 L35 78 L32 68 L22 65 L25 55 L20 50 L25 45 L22 35 L32 32 L35 22 L45 25 Z" fill="none"/>
            </svg>
            <h1>Ignition</h1>
            <p class="subtitle">Authenticate system via Groq key</p>
            <input type="password" id="api-key" class="input-field" placeholder="Paste GSK key here">
            <button id="verify-btn" class="btn">
                <span id="verify-text">Engage System</span>
                <div id="verify-loader" class="loader"></div>
            </button>
            <div id="auth-error" style="color: var(--error); margin-top: 15px; font-size: 0.85rem; height: 20px;"></div>
        </div>
    </div>

    <!-- Chat View -->
    <div id="chat-view" class="view">
        <div class="top-bar">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px var(--success);"></div>
                <span style="font-weight: 700; letter-spacing: 0.05em; font-size: 0.9rem;">AUTOSAGE</span>
            </div>
            <div id="active-model-badge" style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em;">Standby...</div>
        </div>
        
        <div id="chat-container" class="chat-container"></div>
        
        <div class="input-area-wrapper">
            <div class="input-area">
                <textarea id="chat-input" placeholder="Enter diagnostic query..." rows="1"></textarea>
                <button id="send-btn" class="send-btn-circle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Constants & Config
        const GROQ_API_URL = 'https://api.groq.com/openai/v1/chat/completions';
        const GROQ_MODELS_URL = 'https://api.groq.com/openai/v1/models';
        
        const SUPPORTED_MODELS = [
            'llama-3.3-70b-specdec',
            'llama-3.1-70b-versatile',
            'llama-3.1-8b-instant'
        ];

        let sessionApiKey = null;
        let activeModel = SUPPORTED_MODELS[0];
        let chatHistory = [];

        const VEHICLE_TERMS = ['torque', 'wheelbase', 'camshaft', 'transmission', 'ecu', 'abs', 'differential', 'turbocharger', 'rpm', 'suspension', 'chassis', 'crankshaft', 'piston', 'clutch', 'manifold', 'cylinder'];

        // Initial Splash Sequence
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.visibility = 'hidden';
                    document.getElementById('auth-view').classList.add('active');
                }, 1000);
            }, 5000); // 5 seconds splash
        });

        // UI References
        const ui = {
            apiKey: document.getElementById('api-key'),
            verifyBtn: document.getElementById('verify-btn'),
            authError: document.getElementById('auth-error'),
            chatContainer: document.getElementById('chat-container'),
            chatInput: document.getElementById('chat-input'),
            sendBtn: document.getElementById('send-btn'),
            modelBadge: document.getElementById('active-model-badge')
        };

        // Auto-resize textarea
        ui.chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Auth Logic
        ui.verifyBtn.addEventListener('click', async () => {
            const key = ui.apiKey.value.trim();
            if (!key) return;

            ui.verifyBtn.disabled = true;
            document.getElementById('verify-loader').style.display = 'block';
            document.getElementById('verify-text').style.display = 'none';
            ui.authError.textContent = "";

            try {
                const response = await fetch(GROQ_MODELS_URL, {
                    headers: { 'Authorization': `Bearer ${key}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    const availableModels = data.data.map(m => m.id);
                    
                    activeModel = SUPPORTED_MODELS.find(m => availableModels.includes(m)) || availableModels[0];
                    ui.modelBadge.textContent = activeModel;
                    
                    sessionApiKey = key;
                    document.getElementById('auth-view').classList.remove('active');
                    document.getElementById('chat-view').classList.add('active');
                    
                    setTimeout(() => {
                        addMessage('ai', "System online. Diagnostic buffers cleared. I am AutoSage. State your vehicle architecture or mechanical query.");
                    }, 600);
                } else {
                    throw new Error("Invalid Engine Key provided.");
                }
            } catch (err) {
                ui.authError.textContent = err.message;
            } finally {
                ui.verifyBtn.disabled = false;
                document.getElementById('verify-loader').style.display = 'none';
                document.getElementById('verify-text').style.display = 'block';
            }
        });

        // Chat Logic
        async function handleSend() {
            const text = ui.chatInput.value.trim();
            if (!text || !sessionApiKey) return;

            addMessage('user', text);
            ui.chatInput.value = '';
            ui.chatInput.style.height = '44px';
            
            const typingId = addTypingIndicator();
            
            try {
                const response = await fetch(GROQ_API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${sessionApiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: activeModel,
                        messages: [
                            { role: "system", content: "You are AutoSage, a vehicle expert. Use vehicle analogies for everything. Be concise but highly technical. Use at least one technical term like torque, ECU, or chassis in every response." },
                            ...chatHistory,
                            { role: "user", content: text }
                        ],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                
                const aiText = data.choices[0].message.content;
                document.getElementById(typingId).remove();
                addMessage('ai', aiText);
                chatHistory.push({ role: "user", content: text }, { role: "assistant", content: aiText });

                if (chatHistory.length > 10) chatHistory.shift(); // Keep context light

            } catch (err) {
                const typingEl = document.getElementById(typingId);
                if (typingEl) typingEl.remove();
                addMessage('ai', `System Fault: ${err.message}. Re-check API ignition.`);
            }
        }

        ui.sendBtn.addEventListener('click', handleSend);
        ui.chatInput.addEventListener('keydown', (e) => { 
            if(e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault(); 
                handleSend(); 
            } 
        });

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            
            let processedText = text;
            VEHICLE_TERMS.forEach(term => {
                const reg = new RegExp(`\\b${term}\\b`, 'gi');
                processedText = processedText.replace(reg, `<span class="term-highlight">$&</span>`);
            });

            div.innerHTML = `
                <div class="avatar">${role === 'ai' ? '⚙️' : '👤'}</div>
                <div class="msg-content">${processedText.replace(/\n/g, '<br>')}</div>
            `;
            ui.chatContainer.appendChild(div);
            ui.chatContainer.scrollTo({ top: ui.chatContainer.scrollHeight, behavior: 'smooth' });
        }

        function addTypingIndicator() {
            const id = 'typing-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'message ai';
            div.innerHTML = `<div class="avatar">⚙️</div><div class="msg-content" style="font-style: italic; color: var(--text-muted);">Calibrating engine logic...</div>`;
            ui.chatContainer.appendChild(div);
            ui.chatContainer.scrollTop = ui.chatContainer.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
